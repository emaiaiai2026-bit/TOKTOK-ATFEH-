<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1F4B">
<title>توكتوك</title>
<link rel="manifest" href="app-home.webmanifest">
<link rel="icon" type="image/png" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<script>
var PAGES = { rider: 'rider-v19.html', driver: 'driver-v16.html' };
try {
  var saved = localStorage.getItem('tt_role');
  if (saved && PAGES[saved] && location.search.indexOf('choose') === -1) location.replace(PAGES[saved]);
} catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#0B1F4B;color:#fff;font-family:'Cairo',system-ui,sans-serif}
.hero{padding:72px 24px 28px}
h1{margin:0;font-size:40px;font-weight:800;display:inline-block;border-bottom:5px solid #FFB400;line-height:1.3}
.hero p{margin:12px 0 0;color:#B8C6E8;font-size:17px}
.sheet{flex:1;background:#fff;border-radius:24px 24px 0 0;padding:28px 20px 40px;color:#0B1F4B}
.sheet h2{margin:0 0 16px;font-size:19px}
a.card{display:block;text-decoration:none;border-radius:18px;padding:20px;margin-bottom:14px}
a.card b{display:block;font-size:22px;font-weight:800}
a.card span{display:block;margin-top:4px;font-size:14px}
.rider{background:#1A56DB;color:#fff}
.rider span{color:#D6E4FF}
.driver{background:#FFB400;color:#4A3200}
.driver span{color:#6B4A00}
a.card:active{opacity:.9}
a:focus-visible{outline:3px solid #0B1F4B;outline-offset:3px}
</style>
</head>
<body>
<div class="hero"><h1>توكتوك</h1><p>اطلب توكتوك لحد باب بيتك</p></div>
<div class="sheet">
  <h2>اختار حسابك</h2>
  <a class="card rider" data-role="rider" href="#"><b>أنا زبون</b><span>اطلب توكتوك دلوقتي</span></a>
  <a class="card driver" data-role="driver" href="#"><b>أنا سواق</b><span>استقبل الطلبات القريبة منك</span></a>
</div>
<script>
document.querySelectorAll('a.card').forEach(function (a) {
  a.href = PAGES[a.dataset.role];
  a.addEventListener('click', function () {
    try { localStorage.setItem('tt_role', a.dataset.role); } catch (e) {}
  });
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
